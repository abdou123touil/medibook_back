version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=abdou1920touil
      - MONGODB_URI=mongodb://mongo:27017/doctorBooking
    depends_on:
      - mongo
    networks:
      - medibook-network

  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - medibook-network

volumes:
  mongo-data:

networks:
  medibook-network:
    driver: bridge